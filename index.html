<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Letter for my idol! meowk!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bg"></div><div id="bgShade"></div>
<canvas id="fx"></canvas>

<div id="stage">
  <div class="hello" id="hello"></div>
  <div class="env" id="env" tabindex="0" role="button" aria-label="Open the letter">
    <div class="back"></div><div class="card"></div><div class="front"></div><div class="bottom"></div>
    <div class="flap"></div><div class="seal">♥</div>
  </div>
  <div class="tap">tap the envelope</div>
</div>

<div id="letter">
  <div class="paper">
    <h1 id="title"></h1>
    <div id="body"></div>
    <div class="sign" id="sign"></div>
  </div>
  <div class="hint">tap anywhere for a little magic ✨</div>
</div>

<button id="music" aria-label="Toggle music"><span class="eq"><i></i><i></i><i></i></span><span id="songName">Music</span></button>
<audio id="player" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
